[project]
name = "ai-systems-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nima Dadkhah", email = "nima.lewagon.de@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gitsource==0.0.5",
    "jupyter>=1.1.1",
    "markitdown[pdf]==0.1.7",
    "minsearch==0.2.0",
    "openai>=3.16.2",
    "pandas>=2.3.3",
    "requests>=2.34.2",
]

[project.scripts]
ai-systems-lab = "ai_systems_lab:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
